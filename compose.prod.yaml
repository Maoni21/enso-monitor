# Lancement complet en production : base de données + API + site, derrière Caddy.
# Commande, depuis la racine du projet :
#   docker compose -f compose.prod.yaml up -d --build
# Le fichier compose.yaml, lui, ne lance que la base, pour le développement.
name: enso-prod

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Aucun « ports » ici : la base n'est pas joignable depuis Internet,
    # seulement par l'API, sur le réseau interne créé par Docker Compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      # Dans le réseau Docker, la base s'appelle « db » (le nom du service), pas « localhost ».
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    # Pas de « ports » non plus : seul Caddy parle à l'API.

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      DOMAINE: ${DOMAINE:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Caddy y garde ses certificats HTTPS, pour ne pas les redemander à chaque redémarrage.
      - caddy_data:/data
    depends_on:
      - api

volumes:
  db_data:
  caddy_data:
